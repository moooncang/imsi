<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위지란 · 흑월</title>
<style>
  :root{--bg:#121320;--ink:#ece9e4;--red:#bb302f;--dim:#8a8696}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at 50% 30%,#1e1a2a 0%,var(--bg) 60%);color:var(--ink);font:16px/1.6 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
  small{letter-spacing:.35em;color:var(--red);font-size:11px}
  h1{margin:6px 0 2px;font-size:40px;letter-spacing:-.02em}
  p.sub{margin:0 0 28px;color:var(--dim)}
  .stage{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .sprite{width:96px;height:96px;background:url(character.png) no-repeat;image-rendering:pixelated;transform:scale(3);transform-origin:top center;margin-bottom:200px}
  .note{font-size:13px;color:var(--dim);max-width:520px}
  .tag{display:inline-block;margin-top:14px;padding:8px 18px;border:1px solid #3a2f3e;border-radius:999px;font-size:13px;letter-spacing:.1em;color:#d7a1ab;text-decoration:none}
  .tag.play{background:#2a1925;border-color:#bb302f;color:#ffd9de}
  .tag.play:hover{background:#3a2030}
</style>
</head>
<body>
<small>BLACK MOON / TEASER</small>
<h1>위지란</h1>
<p class="sub">무간교 교주의 딸 · 흑월단주 · 장법 하나로 서방을 상대한다</p>
<div class="stage">
  <div class="cell"><div class="sprite" data-first="0" data-count="6" data-fps="8"></div>대기</div>
  <div class="cell"><div class="sprite" data-first="6" data-count="8" data-fps="12"></div>보법 달리기</div>
  <div class="cell"><div class="sprite" data-first="45" data-count="10" data-fps="12"></div>만월</div>
  <div class="cell"><div class="sprite" data-first="111" data-count="12" data-fps="12"></div>월식</div>
</div>
<p class="note">패링으로 적의 공세를 끊고, 흑월장으로 내상을 쌓아, 만월로 터뜨리는 2D 액션. 개발 중.</p>
<a class="tag play" href="play/">▶ 브라우저에서 플레이 (프로토타입)</a>
<p class="note" style="margin-top:10px">PC 키보드 전용. A/D 이동 · W 점프 · Shift 대시 · Space 패링 · J 공격 · E 강화 만월 · Q 월식 · 1~5 훈련 적 · R 초기화</p>
<script>
  // 96px cells, 8 columns. Each sprite plays slots first..first+count-1 at its fps.
  document.querySelectorAll('.sprite').forEach(el=>{
    const first=+el.dataset.first,count=+el.dataset.count,fps=+el.dataset.fps;let i=0;
    const show=()=>{const s=first+i;el.style.backgroundPosition=`-${(s%8)*96}px -${Math.floor(s/8)*96}px`;i=(i+1)%count;};
    show();setInterval(show,1000/fps);
  });
</script>
</body>
</html>
